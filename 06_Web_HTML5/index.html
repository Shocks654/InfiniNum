<head>

    <!-- 1. ADD DARK MODE HANDLING (Keeps default styles but adds a toggle or auto-darkening) -->
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #24292e;
            --card-bg: #f6f8fa;
            --border-color: #d1d5da;
            --accent-color: #0366d6;
        }

        /* Auto-switch to Dark Mode matching your GitHub theme style */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0d1117;
                --text-color: #c9d1d9;
                --card-bg: #161b22;
                --border-color: #30363d;
                --accent-color: #58a6ff;
            }
        }

        /* Apply variables dynamically to body without rewriting your layout structures */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        /* Playground Component Styling */
        .playground-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            max-width: 600px;
        }
        .playground-input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: monospace;
        }
        .playground-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .playground-result {
            margin-top: 15px;
            padding: 10px;
            background: var(--bg-color);
            border-left: 4px solid var(--accent-color);
            font-family: monospace;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <!-- Keep all your original HTML headers, navbar, and copy here -->

    <!-- 2. INSERT PLAYGROUND UI ELEMENT (Place this wherever you want it to appear on your page) -->
    <div class="playground-container">
        <h3>🧮 Live Calculation Playground</h3>
        <p>Test InfiniNum's mathematical processing strings on the fly:</p>
        
        <input type="text" id="num1" class="playground-input" placeholder="Enter an infinitely long number (e.g., 9999999999...)" value="99999999999999999999">
        
        <select id="operation" class="playground-input" style="width: auto; display: block;">
            <option value="add">+</option>
        </select>
        
        <input type="text" id="num2" class="playground-input" placeholder="Enter second number" value="1">
        
        <button onclick="runPlaygroundCalculation()" class="playground-btn">Calculate Engine Output</button>
        
        <div id="output-box" class="playground-result">
            Result will appear here...
        </div>
    </div>

    <!-- 3. INTERACTIVE CALCULATION ENGINE SCRIPT -->
    <script>
        // Temporary lightweight version of your InfiniNum core runner for the UI playground
        class InfiniNum {
            constructor(numberStr) {
                this.digits = numberStr.trim().split('').map(Number);
            }

            add(other) {
                let res = [];
                let i = this.digits.length - 1;
                let j = other.digits.length - 1;
                let carry = 0;

                while (i >= 0 || j >= 0 || carry > 0) {
                    let sum = carry;
                    if (i >= 0) sum += this.digits[i--];
                    if (j >= 0) sum += other.digits[j--];
                    carry = Math.floor(sum / 10);
                    res.push(sum % 10);
                }
                return res.reverse().join('');
            }
        }

        function runPlaygroundCalculation() {
            const val1 = document.getElementById('num1').value;
            const val2 = document.getElementById('num2').value;
            
            if(!val1 || !val2) {
                document.getElementById('output-box').innerText = "Please enter values into both fields.";
                return;
            }

            const n1 = new InfiniNum(val1);
            const n2 = new InfiniNum(val2);
            const sumResult = n1.add(n2);

            document.getElementById('output-box').innerText = `Result: ${sumResult}`;
        }
    </script>
