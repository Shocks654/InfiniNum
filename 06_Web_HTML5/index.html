        <h3>🧮 Live Calculation Playground</h3>

    <!-- ARITHMETIC PARSING LOGIC ENGINE -->
    <script>
        class InfiniNum {
            constructor(numberStr) {
                // Safeguard input strings from malicious alphabet strings injecting NaN values
                let cleanStr = numberStr.trim().replace(/[^0-9\-]/g, '');
                if (!cleanStr) cleanStr = "0";
                
                this.isNegative = cleanStr.startsWith('-');
                if (this.isNegative) {
                    cleanStr = cleanStr.slice(1);
                }
                this.digits = cleanStr.split('').map(Number);
            }

            toString() {
                let str = this.digits.join('');
                str = str.replace(/^0+/, ''); 
                if (str === '') return "0";
                return this.isNegative ? '-' + str : str;
            }

            // Big Arbitrary Integer Addition Logic
            add(other) {
                let res = [];
                let i = this.digits.length - 1;
                let j = other.digits.length - 1;
                let carry = 0;

                while (i >= 0 || j >= 0 || carry > 0) {
                    let sum = carry;
                    if (i >= 0) sum += this.digits[i--];
                    if (j >= 0) sum += other.digits[j--];
                    carry = Math.floor(sum / 10);
                    res.push(sum % 10);
                }
                return res.reverse().join('');
            }

            // Subtraction handler wrapping mapping functions
            subtract(other) {
                let num1Str = this.toString();
                let num2Str = other.toString();
                
                try {
                    return (BigInt(num1Str) - BigInt(num2Str)).toString();
                } catch(e) {
                    return "Calculation limit threshold met.";
                }
            }

            // High Precision Schoolbook Multiplication
            multiply(other) {
                let num1Str = this.toString();
                let num2Str = other.toString();

                if (num1Str === "0" || num2Str === "0") return "0";
                
                let resultArr = Array(this.digits.length + other.digits.length).fill(0);
                
                for (let i = this.digits.length - 1; i >= 0; i--) {
                    for (let j = other.digits.length - 1; j >= 0; j--) {
                        let mul = this.digits[i] * other.digits[j];
                        let sum = mul + resultArr[i + j + 1];
                        
                        resultArr[i + j + 1] = sum % 10;
                        resultArr[i + j] += Math.floor(sum / 10);
                    }
                }
                
                let finalStr = resultArr.join('').replace(/^0+/, '');
                return finalStr === '' ? '0' : finalStr;
            }

            // Pure Fraction Division Execution Module
            divide(other) {
                let num2Str = other.toString();
                if (num2Str === "0") return "Error: Division by Zero";
                return (BigInt(this.toString()) / BigInt(num2Str)).toString();
            }
        }

        function runPlaygroundCalculation() {
            const val1 = document.getElementById('num1').value;
            const val2 = document.getElementById('num2').value;
            const op = document.getElementById('operation').value;
            
            // Rejects pure letter keys instantly to block NaN errors completely
            if (/[a-zA-Z]/.test(val1) || /[a-zA-Z]/.test(val2)) {
                document.getElementById('output-box').innerText = "Parsing Error: Please enter numerical strings only!";
                return;
            }

            if (!val1 || !val2) {
                document.getElementById('output-box').innerText = "Please enter values into both fields.";
                return;
            }

            const n1 = new InfiniNum(val1);
            const n2 = new InfiniNum(val2);
            let calcResult = "";

            if (op === "add") {
                calcResult = n1.add(n2);
            } else if (op === "subtract") {
                calcResult = n1.subtract(n2);
            } else if (op === "multiply") {
                calcResult = n1.multiply(n2);
            } else if (op === "divide") {
                calcResult = n1.divide(n2);
            }

            document.getElementById('output-box').innerText = `Result: ${calcResult}`;
        }
    </script>
</body>
