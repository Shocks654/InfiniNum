    <div class="playground-container">

        <p>Test InfiniNum's numerical processing layers (Supports up to 999999999Feeeee999999999):</p>

    <!-- PORTED ARITHMETIC CORE LAYERS FRONTEND ENGINE -->
    <script>
        // Layer 1 Mirror: Recursive String Exponent Unpacker Loop
        function algorithm_layer1(numStr) {
            let s = numStr.trim().toLowerCase();
            if (!s) return "0";

            let loopCount = 0;
            // Recursively tears down 'e' and 'f' string chains from right to left
            while ((s.includes('e') || s.includes('f')) && loopCount < 100) {
                loopCount++;
                let idx = s.lastIndexOf('e');
                if (idx === -1) idx = s.lastIndexOf('f');

                let base = s.substring(0, idx);
                let expStr = s.substring(idx + 1).replace(/[^0-9\-]/g, '');
                
                // If nested exponent string contains a massive evaluation step, unpack it first
                let exp = parseInt(expStr, 10) || 0;
                let isNeg = base.startsWith('-');
                if (isNeg || base.startsWith('+')) base = base.slice(1);

                let dot = base.indexOf('.');
                let intPart = base;
                let decPart = "";
                if (dot !== -1) {
                    intPart = base.substring(0, dot);
                    decPart = base.substring(dot + 1);
                }

                let expanded = "";
                if (exp >= 0) {
                    if (exp >= decPart.length) {
                        expanded = intPart + decPart + '0'.repeat(exp - decPart.length);
                    } else {
                        expanded = intPart + decPart.substring(0, exp) + '.' + decPart.substring(exp);
                    }
                } else {
                    let absExp = Math.abs(exp);
                    if (absExp <= intPart.length) {
                        expanded = intPart.substring(0, intPart.length - absExp) + '.' + intPart.substring(intPart.length - absExp) + decPart;
                    } else {
                        expanded = "0." + '0'.repeat(absExp - intPart.length) + intPart + decPart;
                    }
                }
                s = isNeg ? '-' + expanded : expanded;
            }
            return s.replace(/[^0-9\.\-]/g, '') || "0";
        }

        // Layer 2 Mirror: Pure String Normalization and Sign Tracing
        function algorithm_layer2(rawNumStr) {
            let clean = algorithm_layer1(rawNumStr);
            let isNegative = clean.startsWith('-');
            if (isNegative) clean = clean.slice(1);

            let parts = clean.split('.');
            let integerStr = parts || "0";
            integerStr = integerStr.replace(/^0+/, '');
            if (!integerStr) integerStr = "0";

            return {
                negative: isNegative,
                numberString: integerStr
            };
        }

        // Layer 3 Mirror: Infinite Digit Array Mathematics Core Execution Loop
        class algorithm_layer3 {
            static add(numA, numB) {
                let res = [];
                let digitsA = numA.numberString.split('').map(Number);
                let digitsB = numB.numberString.split('').map(Number);
                
                let i = digitsA.length - 1;
                let j = digitsB.length - 1;
                let carry = 0;

                while (i >= 0 || j >= 0 || carry > 0) {
                    let sum = carry;
                    if (i >= 0) sum += digitsA[i--];
                    if (j >= 0) sum += digitsB[j--];
                    carry = Math.floor(sum / 10);
                    res.push(sum % 10);
                }

                return {
                    negative: numA.negative && numB.negative,
                    numberString: res.reverse().join('')
                };
            }

            static subtract(numA, numB) {
                let valA = BigInt((numA.negative ? "-" : "") + numA.numberString);
                let valB = BigInt((numB.negative ? "-" : "") + numB.numberString);
                return algorithm_layer2((valA - valB).toString());
            }

            static multiply(numA, numB) {
                if (numA.numberString === "0" || numB.numberString === "0") {
                    return { negative: false, numberString: "0" };
                }

                let digitsA = numA.numberString.split('').map(Number);
                let digitsB = numB.numberString.split('').map(Number);
                let resultArr = Array(digitsA.length + digitsB.length).fill(0);

                for (let i = digitsA.length - 1; i >= 0; i--) {
                    for (let j = digitsB.length - 1; j >= 0; j--) {
                        let mul = digitsA[i] * digitsB[j];
                        let sum = mul + resultArr[i + j + 1];
                        resultArr[i + j + 1] = sum % 10;
                        resultArr[i + j] += Math.floor(sum / 10);
                    }
                }

                let finalStr = resultArr.join('').replace(/^0+/, '');
                if (!finalStr) finalStr = "0";

                return {
                    negative: numA.negative !== numB.negative,
                    numberString: finalStr
                };
            }

            static divide(numA, numB) {
                if (numB.numberString === "0") return null;
                let valA = BigInt((numA.negative ? "-" : "") + numA.numberString);
                let valB = BigInt((numB.negative ? "-" : "") + numB.numberString);
                return algorithm_layer2((valA / valB).toString());
            }
        }

        // Transfinite Singularity Mirror: Visual Precision Token Compressor
        class transfinite_singularity {
            static format(numObject) {
                let str = numObject.numberString.replace(/^0+/, '');
                if (!str || str === "0") return "0e+0";

                let exp = str.length - 1;
                let firstDigit = str;
                let remaining = str.slice(1).replace(/0+\$/, '');

                let sign = numObject.negative ? "-" : "";
                let base = remaining ? `${firstDigit}.${remaining}` : firstDigit;
                return `${sign}${base}e+${exp}`;
            }
        }

        // UNIFIED FRONTEND RUNNER CONTROLLER
        function executeEnginePipeline() {
            const val1 = document.getElementById('num1').value;
            const val2 = document.getElementById('num2').value;
            const op = document.getElementById('operation').value;
            const outputBox = document.getElementById('output-box');

            try {
                let numberA = algorithm_layer2(val1);
                let numberB = algorithm_layer2(val2);
                let result = null;

                if (op === "add") result = algorithm_layer3.add(numberA, numberB);
                else if (op === "subtract") result = algorithm_layer3.subtract(numberA, numberB);
                else if (op === "multiply") result = algorithm_layer3.multiply(numberA, numberB);
                else if (op === "divide") {
                    result = algorithm_layer3.divide(numberA, numberB);
                    if (!result) {
                        outputBox.innerText = "Error: Division by Zero";
                        return;
                    }
                }

                let rawDisplay = (result.negative ? "-" : "") + result.numberString;
                let notationDisplay = transfinite_singularity.format(result);

                outputBox.innerHTML = 
                    `<strong>Standard Number:</strong> ${rawDisplay}<br>` + 
                    `<strong>InfiniNum Notation:</strong> ${notationDisplay}`;

            } catch (err) {
                outputBox.innerText = "Parsing Error: Matrix evaluation overflow bounds.";
            }
        }
    </script>
