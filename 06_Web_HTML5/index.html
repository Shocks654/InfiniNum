<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfiniNum - Infinite Precision Math</title>
    <!-- ========================================================================== -->
    <!-- INFININUM WEB UI - MULTI-PAGE TEXTUAL MODE                                 -->
    <!-- LICENSED UNDER THE MIT LICENSE - COPYRIGHT (C) 2026 SHOCKS654              -->
    <!-- STRICTLY ENGLISH COMMENTS - NO PAINT WATERMARKS OR LAG OVERHEAD ALLOWED    -->
    <!-- ========================================================================== -->
    <link rel="stylesheet" href="assets/styles.css">
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #24292e;
            --card-bg: #f6f8fa;
            --border-color: #d1d5da;
            --accent-color: #0366d6;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0d1117;
                --text-color: #c9d1d9;
                --card-bg: #161b22;
                --border-color: #30363d;
                --accent-color: #58a6ff;
            }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            padding: 20px;
            font-family: monospace;
        }

        .playground-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-top: 25px;
            max-width: 600px;
        }

        .playground-input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin: 8px 0;
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: monospace;
        }

        .playground-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .playground-result {
            margin-top: 15px;
            padding: 10px;
            background: var(--bg-color);
            border-left: 4px solid var(--accent-color);
            font-family: monospace;
            word-break: break-all;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <!-- ORIGINAL INFININUM HERO TEXT HOOK -->
    INFININUM ∞<br>
    The best option for numbers<br>
    
    <a href="download.html" style="color: #000000; text-decoration: underline; font-weight: bold;">Download today</a>

    <!-- THE LIVE BACKEND RUNNER PLAYGROUND -->
    <div class="playground-container">
        <h3>🧮 Live Calculation Playground (Python Core Mirror)</h3>
        <p>Test InfiniNum's numerical processing layers (Supports up to 999999999Feeeee999999999):</p>
        
        <input type="text" id="num1" class="playground-input" placeholder="Enter first number" value="99999Feee99">
        
        <select id="operation" class="playground-input" style="width: auto; display: block;">
            <option value="multiply">*</option>
            <option value="add">+</option>
            <option value="subtract">-</option>
            <option value="divide">/</option>
        </select>
        
        <input type="text" id="num2" class="playground-input" placeholder="Enter second number" value="ee100">
        
        <button onclick="executePythonEnginePipeline()" class="playground-btn">Calculate Output</button>
        
        <div id="output-box" class="playground-result">
            Engine pipeline disconnected. Start server.py to listen...
        </div>
    </div>

    <script src="assets/fix_audio.js"></script>
    <script src="scripts/ui_controller.js"></script>

    <script>
        async function executePythonEnginePipeline() {
            const num1 = document.getElementById('num1').value;
            const num2 = document.getElementById('num2').value;
            const operation = document.getElementById('operation').value;
            const outputBox = document.getElementById('output-box');

            outputBox.innerText = "Executing across 01_Core_Python layers...";

            try {
                // FIXED LOCALHOST BACKEND ADDRESS ROUTE LINE BELOW
                const response = await fetch('http://127.0.0', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ num1, num2, operation })
                });

                const data = await response.json();
                
                if (data.error) {
                    outputBox.innerText = `Engine Error: ${data.error}`;
                } else {
                    outputBox.innerHTML = 
                        `<strong>Standard Number:</strong> ${data.standard_number}<br>` + 
                        `<strong>InfiniNum Notation:</strong> ${data.transfinite_output}`;
                }
            } catch (err) {
                outputBox.innerText = "Connection lost. Please make sure server.py is running in the background!";
            }
        }
    </script>
</body>
</html>
