    <!-- INTERACTIVE FRONTEND PLAYGROUND LAYOUT -->
    <div class="playground-container">
        <h3>🧮 Live Calculation Playground</h3>
        <p>Input your numerical targets or scientific notations (e.g., 9e+1000):</p>
        
        <input type="text" id="num1" class="playground-input" placeholder="Enter number or notation" value="9e+5">
        
        <select id="operation" class="playground-input" style="width: auto; display: block;">
            <option value="add">+</option>
            <option value="subtract">-</option>
            <option value="multiply">*</option>
            <option value="divide">/</option>
        </select>
        
        <input type="text" id="num2" class="playground-input" placeholder="Enter second number or notation" value="1">
        
        <button onclick="runPlaygroundCalculation()" class="playground-btn">Calculate Engine Output</button>
        
        <div id="output-box" class="playground-result">
            Result will appear here...
        </div>
    </div>

    <!-- INTERACTION CONTROLLER SCRIPT -->
    <script>
        class PlaygroundNotationHandler {
            // Evaluates and normalizes scientific expressions cleanly to block NaN loops
            static normalizeStringInput(str) {
                let s = str.trim().toLowerCase();
                if (!s) return "0";
                
                if (s.includes('e')) {
                    let [base, expStr] = s.split('e');
                    let exp = parseInt(expStr, 10) || 0;
                    
                    let isNeg = base.startsWith('-');
                    if (isNeg || base.startsWith('+')) base = base.slice(1);
                    
                    let parts = base.split('.');
                    let intPart = parts[0];
                    let decPart = parts[1] || "";
                    
                    let expanded = "";
                    if (exp >= 0) {
                        if (exp >= decPart.length) {
                            expanded = intPart + decPart + '0'.repeat(exp - decPart.length);
                        } else {
                            expanded = intPart + decPart.substring(0, exp) + '.' + decPart.substring(exp);
                        }
                    } else {
                        let absExp = Math.abs(exp);
                        if (absExp <= intPart.length) {
                            expanded = intPart.substring(0, intPart.length - absExp) + '.' + intPart.substring(intPart.length - absExp) + decPart;
                        } else {
                            expanded = "0." + '0'.repeat(absExp - intPart.length) + intPart + decPart;
                        }
                    }
                    return isNeg ? '-' + expanded : expanded;
                }
                return s.replace(/[^0-9\.\-]/g, '') || "0";
            }

            // Strips and packages display arrays back into readable scientific notation formats
            static formatToScientific(rawNumStr) {
                let clean = rawNumStr.replace(/[^0-9\-]/g, '');
                if (!clean || clean === "0" || clean === "-") return "0e+0";
                
                let isNeg = clean.startsWith('-');
                let digits = isNeg ? clean.slice(1) : clean;
                
                digits = digits.replace(/^0+/, '');
                if (!digits) return "0e+0";
                
                let first = digits[0];
                let rest = digits.slice(1).replace(/0+\$/, '');
                let exp = digits.length - 1;
                
                let sign = isNeg ? "-" : "";
                let base = rest ? `${first}.${rest}` : first;
                return `${sign}${base}e+${exp}`;
            }
        }

        function runPlaygroundCalculation() {
            const val1 = document.getElementById('num1').value;
            const val2 = document.getElementById('num2').value;
            const op = document.getElementById('operation').value;

            if (!val1 || !val2) {
                document.getElementById('output-box').innerText = "Missing structural parameters.";
                return;
            }

            try {
                // Parse clean integer expressions out from potential decimal positions safely
                let parsed1 = PlaygroundNotationHandler.normalizeStringInput(val1).split('.')[0];
                let parsed2 = PlaygroundNotationHandler.normalizeStringInput(val2).split('.')[0];
                
                let b1 = BigInt(parsed1);
                let b2 = BigInt(parsed2);
                let resultStr = "";

                if (op === "add") resultStr = (b1 + b2).toString();
                else if (op === "subtract") resultStr = (b1 - b2).toString();
                else if (op === "multiply") resultStr = (b1 * b2).toString();
                else if (op === "divide") {
                    if (b2 === 0n) {
                        document.getElementById('output-box').innerText = "Error: Division by Zero";
                        return;
                    }
                    resultStr = (b1 / b2).toString();
                }

                let notationOutput = PlaygroundNotationHandler.formatToScientific(resultStr);

                document.getElementById('output-box').innerHTML = 
                    `<strong>Standard Output:</strong> ${resultStr}<br>` + 
                    `<strong>InfiniNum Notation:</strong> ${notationOutput}`;

            } catch (e) {
                document.getElementById('output-box').innerText = "Parsing Error: Numerical inputs only.";
            }
        }
    </script>
</body>
